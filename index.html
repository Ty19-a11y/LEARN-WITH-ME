<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tyrese's Learning Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #151820;
      --surface2: #1c2030;
      --border: #2a2f42;
      --accent: #4f8ef7;
      --accent2: #7c5cfc;
      --accent3: #38d9a9;
      --text: #e8ecf4;
      --text-muted: #6b7394;
      --glow: rgba(79, 142, 247, 0.15);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient background blobs */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: -100px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(79,142,247,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -200px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(124,92,252,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      padding: 48px 24px 40px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(79,142,247,0.05) 0%, transparent 100%);
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(79,142,247,0.1);
      border: 1px solid rgba(79,142,247,0.25);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .logo-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent3);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #e8ecf4 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 48px auto;
      padding: 0 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
    }

    .card-label {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: var(--text);
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
      line-height: 1.6;
    }

    textarea::placeholder { color: var(--text-muted); }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      transition: opacity 0.15s;
    }

    button:hover::after { opacity: 0.07; }
    button:active::after { opacity: 0.12; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-summarize {
      background: linear-gradient(135deg, var(--accent), #3a7bd5);
      color: white;
      box-shadow: 0 4px 14px rgba(79,142,247,0.25);
    }

    .btn-flashcards {
      background: linear-gradient(135deg, var(--accent2), #5b3fd4);
      color: white;
      box-shadow: 0 4px 14px rgba(124,92,252,0.25);
    }

    .btn-quiz {
      background: linear-gradient(135deg, #2dbd94, var(--accent3));
      color: #0d0f14;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(56,217,169,0.25);
    }

    .btn-icon {
      font-size: 16px;
      line-height: 1;
    }

    /* Output area */
    .output-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      min-height: 160px;
      transition: border-color 0.3s;
    }

    .output-card.active { border-color: rgba(236, 236, 236, 0.4); }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .output-title {
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .output-status {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.loading {
      background: var(--accent);
      animation: pulse 1s ease-in-out infinite;
    }

    .status-dot.done { background: var(--accent3); }

    .output-body {
      padding: 22px;
      font-size: 14px;
      font-weight: 300;
      line-height: 1.75;
      color: var(--text-muted);
      min-height: 120px;
    }

    .output-body.has-content { color: var(--text); }

    /* Flashcard grid */
    .flashcard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 4px;
    }

    .flashcard {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--text);
      position: relative;
      padding-left: 28px;
    }

    .flashcard::before {
      content: '◆';
      position: absolute;
      left: 10px;
      top: 15px;
      font-size: 7px;
      color: var(--accent2);
    }

    /* Quiz list */
    .quiz-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    .quiz-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.55;
    }

    .quiz-num {
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent3);
      min-width: 22px;
      padding-top: 1px;
    }

    /* Loading shimmer */
    .shimmer {
      background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 6px;
      height: 14px;
      margin-bottom: 10px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .shimmer:nth-child(2) { width: 85%; }
    .shimmer:nth-child(3) { width: 70%; }

    /* Error state */
    .error-msg {
      color: #f87171;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
    }

    /* Fade in animation for results */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-up { animation: fadeUp 0.35s ease forwards; }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <div class="logo-badge">AI Study Assistant</div>
  <h1>Tyrese's Learning Hub</h1>
  <p>Paste your notes — let AI do the heavy lifting</p>
</header>

<div class="container">
  <div class="card">
    <div class="card-label">Your Notes</div>
    <textarea id="notesInput" placeholder="Paste your study notes, textbook excerpts, or any content you want to learn from..."></textarea>
    <div class="actions">
      <button class="btn-summarize" onclick="summarizeNotes()">
        <span class="btn-icon"></span> Summarize
      </button>
      <button class="btn-flashcards" onclick="generateFlashcards()">
        <span class="btn-icon"></span> Flashcards
      </button>
      <button class="btn-quiz" onclick="createQuiz()">
        <span class="btn-icon"></span> Create Quiz
      </button>
    </div>
  </div>

  <div class="output-card" id="outputCard">
    <div class="output-header">
      <span class="output-title" id="outputTitle">Output</span>
      <span class="output-status" id="outputStatus">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Waiting for input</span>
      </span>
    </div>
    <div class="output-body" id="outputBox">
      <span style="color: var(--text-muted); font-style: italic;">Results will appear here after you click one of the buttons above.</span>
    </div>
  </div>
</div>

<footer>
  Powered by Groq &amp; LLaMA 3 — Built for Tyrese
</footer>

<script>
  const BASE_URL = '';

  function setLoading(label) {
    document.getElementById('outputTitle').textContent = label;
    document.getElementById('statusDot').className = 'status-dot loading';
    document.getElementById('statusText').textContent = 'Generating...';
    document.getElementById('outputCard').classList.add('active');
    document.getElementById('outputBox').className = 'output-body';
    document.getElementById('outputBox').innerHTML = `
      <div class="shimmer"></div>
      <div class="shimmer"></div>
      <div class="shimmer"></div>
    `;
    document.querySelectorAll('button').forEach(b => b.disabled = true);
  }

  function setDone() {
    document.getElementById('statusDot').className = 'status-dot done';
    document.getElementById('statusText').textContent = 'Done';
    document.getElementById('outputBox').classList.add('has-content');
    document.querySelectorAll('button').forEach(b => b.disabled = false);
  }

  function setError(msg) {
    document.getElementById('statusDot').className = 'status-dot';
    document.getElementById('statusText').textContent = 'Error';
    document.getElementById('outputBox').innerHTML = `<div class="error-msg">⚠ ${msg}</div>`;
    document.querySelectorAll('button').forEach(b => b.disabled = false);
  }

  function getNotes() {
    const notes = document.getElementById('notesInput').value.trim();
    if (!notes) {
      alert('Please paste some notes first!');
      return null;
    }
    return notes;
  }

  async function summarizeNotes() {
    const notes = getNotes();
    if (!notes) return;

    setLoading('Summary');

    try {
      const response = await fetch(`${BASE_URL}/summarize`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: notes })
      });

      if (!response.ok) throw new Error(`Server error: ${response.status}`);
      const data = await response.json();

      document.getElementById('outputBox').innerHTML = `
        <div class="fade-up" style="line-height: 1.8;">${data.summary.replace(/\n/g, '<br>')}</div>
      `;
      setDone();
    } catch (err) {
      setError(err.message || 'Could not connect to the server. Make sure app.py is running.');
    }
  }

  async function generateFlashcards() {
    const notes = getNotes();
    if (!notes) return;

    setLoading('Flashcards');

    try {
      const response = await fetch(`${BASE_URL}/flashcards`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: notes })
      });

      if (!response.ok) throw new Error(`Server error: ${response.status}`);
      const data = await response.json();

      const cards = data.cards.filter(c => c.trim());
      const html = `
        <div class="fade-up">
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">${cards.length} cards generated</div>
          <div class="flashcard-grid">
            ${cards.map(c => `<div class="flashcard">${c.replace(/^[-•*]\s*/, '')}</div>`).join('')}
          </div>
        </div>
      `;
      document.getElementById('outputBox').innerHTML = html;
      setDone();
    } catch (err) {
      setError(err.message || 'Could not connect to the server. Make sure app.py is running.');
    }
  }

  async function createQuiz() {
    const notes = getNotes();
    if (!notes) return;

    setLoading('Quiz');

    try {
      const response = await fetch(`${BASE_URL}/quiz`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: notes })
      });

      if (!response.ok) throw new Error(`Server error: ${response.status}`);
      const data = await response.json();

      const questions = data.questions.filter(q => q.trim());
      const html = `
        <div class="fade-up">
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">${questions.length} questions generated</div>
          <ul class="quiz-list">
            ${questions.map((q, i) => `
              <li class="quiz-item">
                <span class="quiz-num">${i + 1}</span>
                <span>${q.replace(/^\d+\.\s*/, '')}</span>
              </li>
            `).join('')}
          </ul>
        </div>
      `;
      document.getElementById('outputBox').innerHTML = html;
      setDone();
    } catch (err) {
      setError(err.message || 'Could not connect to the server. Make sure app.py is running.');
    }
  }
</script>

</body>
</html>
